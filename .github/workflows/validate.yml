name: Validate card news

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "fixtures/**"
      - "output/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "scripts/**"
      - "start.bat"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Unit tests
        run: |
          python -m compileall -q src tests
          pytest -q
      - name: Validate committed packages
        shell: bash
        run: |
          if [[ ! -d output ]]; then
            echo "No committed output directory."
            exit 0
          fi
          while IFS= read -r package; do
            sports-card-news validate "$package"
          done < <(find output -name package.json -type f -print)
