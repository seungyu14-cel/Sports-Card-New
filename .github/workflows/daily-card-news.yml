name: Daily sports card news

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      edition_date:
        description: "편집일(YYYY-MM-DD). 비워두면 오늘(Asia/Seoul)"
        required: false
        type: string
      use_demo:
        description: "OpenAI API 대신 데모 데이터 사용"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-card-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_NEWS_MODEL: gpt-6.1-sol
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install package
        run: python -m pip install ".[dev]"

      - name: Run unit tests before API usage
        run: |
          python -m compileall -q src tests
          pytest -q

      - name: Resolve edition date
        id: edition
        shell: bash
        run: |
          requested="${{ inputs.edition_date }}"
          if [[ -n "$requested" ]]; then
            edition_date="$requested"
          else
            edition_date="$(date +%F)"
          fi
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"

      - name: Build Supabase game newsroom context
        if: inputs.use_demo != true
        shell: bash
        run: |
          edition_date="${{ steps.edition.outputs.date }}"
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            sports-card-news newsroom-status
            sports-card-news game-news --date "$edition_date"
          else
            echo "Supabase secrets are not configured; continuing with legacy research flow."
          fi

      - name: Generate cards
        shell: bash
        run: |
          edition_date="${{ steps.edition.outputs.date }}"
          if [[ "${{ inputs.use_demo }}" == "true" ]]; then
            sports-card-news daily --date "$edition_date" --fixture fixtures/demo_package.json
          else
            if [[ -z "$OPENAI_API_KEY" ]]; then
              echo "OPENAI_API_KEY repository secret is required." >&2
              exit 1
            fi
            sports-card-news daily --date "$edition_date"
          fi

      - name: Validate generated package
        shell: bash
        run: |
          edition_date="${{ steps.edition.outputs.date }}"
          sports-card-news validate "output/$edition_date/package.json"
          test -s "output/$edition_date/caption-instagram.md"
          test -s "output/$edition_date/sources.md"
          test -s "output/$edition_date/visual-qa.md"
          test -s "output/$edition_date/alt-text.json"
          test -s "output/$edition_date/publish-manifest.json"
          unzip -t "output/$edition_date/instagram-carousel.zip"

      - name: Commit generated draft
        id: commit
        shell: bash
        run: |
          edition_date="${{ steps.edition.outputs.date }}"
          branch="automation/daily-${edition_date}"
          git config user.name "sports-card-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git add -f "output/$edition_date"
          if git diff --cached --quiet; then
            echo "No generated changes."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "content: add ${edition_date} sports card draft"
          git push --force-with-lease --set-upstream origin "$branch"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open or update draft pull request
        if: steps.commit.outputs.created == 'true'
        shell: bash
        run: |
          edition_date="${{ steps.edition.outputs.date }}"
          branch="${{ steps.commit.outputs.branch }}"
          title="[검토 필요] ${edition_date} 스포츠 카드뉴스"
          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr"               --title "$title"               --body-file "output/$edition_date/editorial-review.md"
            echo "같은 날짜의 Draft PR #${existing_pr}을 새 결과로 갱신했습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create               --draft               --base "${{ github.event.repository.default_branch }}"               --head "$branch"               --title "$title"               --body-file "output/$edition_date/editorial-review.md"
          fi

      - name: Upload review artifact
        if: always() && steps.edition.outputs.date != ''
        uses: actions/upload-artifact@v4
        with:
          name: card-news-${{ steps.edition.outputs.date }}-${{ github.run_id }}
          path: output/${{ steps.edition.outputs.date }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "## 카드뉴스 자동화 중단" >> "$GITHUB_STEP_SUMMARY"
          echo "실패한 단계의 로그와 위의 Artifact를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          echo "재실행하면 같은 날짜의 브랜치와 Draft PR을 갱신하므로 중복 PR이 생기지 않습니다." >> "$GITHUB_STEP_SUMMARY"
