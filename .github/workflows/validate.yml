name: Validate card news

on:
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "fixtures/**"
      - "output/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Validate committed packages
        shell: bash
        run: |
          while IFS= read -r package; do
            sports-card-news validate "$package"
          done < <(find output -name package.json -type f -print)

